databases:
  - name: mxodontologia-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: mxodontologia-web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn mxodontologia.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /login/
    envVars:
      - key: DEBUG
        value: "False"
      # generateValue faz o Render criar um segredo aleatório e guardá-lo fora
      # do repositório. Nunca versione o valor real da SECRET_KEY.
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mxodontologia-db
          property: connectionString
      # Credenciais de e-mail: preenchidas no painel do Render, nunca aqui.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
    autoDeploy: true
